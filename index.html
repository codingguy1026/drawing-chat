<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니챗봇</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --primary-hover-color: #5b4bc4;
            --primary-light-color: rgba(108, 92, 231, 0.12);
            --bg-body-gradient: linear-gradient(135deg, #eef2ff 0%, #e0f2fe 45%, #fdf2f8 100%);
            --bg-container-glass: rgba(255, 255, 255, 0.72);
            --bg-sidebar-glass: rgba(26, 27, 38, 0.88);
            --bg-sidebar-hover: rgba(255, 255, 255, 0.06);
            --bg-sidebar-active: rgba(108, 92, 231, 0.24);
            --bg-input-glass: rgba(255, 255, 255, 0.5);
            --user-bubble-bg: #6c5ce7;
            --user-bubble-text: #ffffff;
            --bot-bubble-bg: #ffffff;
            --bot-bubble-text: #1e293b;
            --muted-text: #64748b;
            --time-text-color: #94a3b8;
            --glass-border: 1px solid rgba(255, 255, 255, 0.58);
            --glass-border-dark: 1px solid rgba(255, 255, 255, 0.08);
            --shadow-soft: 0 8px 32px rgba(31, 38, 135, 0.05), 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-deep: 0 18px 46px rgba(31, 38, 135, 0.11);
            --modal-overlay-bg: rgba(15, 23, 42, 0.32);
            --danger-color: #ef4444;
            --danger-hover-color: #dc2626;
            --danger-bg-light: rgba(239, 68, 68, 0.09);
            --danger-border-light: rgba(239, 68, 68, 0.18);
            --neutral-btn-bg: rgba(15, 23, 42, 0.06);
            --neutral-btn-hover: rgba(15, 23, 42, 0.1);
            --neutral-btn-text: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-body-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: var(--bot-bubble-text);
        }

        button, input {
            font: inherit;
        }

        .bg-decor-1,
        .bg-decor-2,
        .bg-decor-3 {
            position: absolute;
            border-radius: 999px;
            filter: blur(95px);
            z-index: -1;
            pointer-events: none;
            opacity: 0.55;
        }

        .bg-decor-1 {
            width: 320px;
            height: 320px;
            background: #a29bfe;
            top: 14%;
            left: 18%;
        }

        .bg-decor-2 {
            width: 340px;
            height: 340px;
            background: #fde68a;
            bottom: 18%;
            right: 14%;
        }

        .bg-decor-3 {
            width: 260px;
            height: 260px;
            background: #93c5fd;
            right: 36%;
            top: 8%;
            opacity: 0.35;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1040px;
            height: 100vh;
            padding: 24px;
            gap: 22px;
            position: relative;
        }

        @media (min-width: 769px) {
            .app-container {
                height: 86vh;
            }
        }

        .sidebar {
            width: 270px;
            background-color: var(--bg-sidebar-glass);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: var(--glass-border-dark);
            border-radius: 26px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
            box-shadow: var(--shadow-deep);
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 22px 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            border-radius: 12px;
            font-size: 18px;
            box-shadow: 0 6px 18px rgba(108, 92, 231, 0.34);
        }

        .logo-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .logo-name {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .logo-desc {
            margin-top: 2px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.48);
            font-weight: 600;
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.42);
            text-transform: uppercase;
            letter-spacing: 1.4px;
        }

        .new-chat-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 750;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.32);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        }

        .new-chat-btn:hover {
            background-color: var(--primary-hover-color);
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(108, 92, 231, 0.4);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-list::-webkit-scrollbar,
        #chatbox::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.13);
            border-radius: 999px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 11px 10px 11px 13px;
            border-radius: 16px;
            cursor: pointer;
            transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
            border: 1px solid transparent;
            user-select: none;
        }

        .chat-item:hover {
            background-color: var(--bg-sidebar-hover);
        }

        .chat-item.active {
            background-color: var(--bg-sidebar-active);
            border-color: rgba(108, 92, 231, 0.32);
            box-shadow: 0 8px 18px rgba(108, 92, 231, 0.12);
        }

        .chat-item-main {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-item-title {
            color: rgba(255, 255, 255, 0.96);
            font-size: 13.5px;
            font-weight: 700;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .chat-item-preview {
            color: rgba(255, 255, 255, 0.46);
            font-size: 11px;
            line-height: 1.3;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .chat-delete-btn {
            width: 26px;
            height: 26px;
            border-radius: 999px;
            border: none;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.34);
            cursor: pointer;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.18s ease, color 0.18s ease, background-color 0.18s ease, transform 0.18s ease;
        }

        .chat-item:hover .chat-delete-btn,
        .chat-item.active .chat-delete-btn {
            opacity: 1;
        }

        .chat-delete-btn:hover {
            background: rgba(239, 68, 68, 0.16);
            color: #fecaca;
            transform: scale(1.06);
        }

        .chat-container {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-container-glass);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: var(--glass-border);
            border-radius: 30px;
            box-shadow: var(--shadow-deep);
            overflow: hidden;
            position: relative;
        }

        .menu-toggle-btn {
            display: none;
            position: absolute;
            top: 18px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: var(--glass-border);
            background-color: rgba(255, 255, 255, 0.86);
            color: var(--bot-bubble-text);
            font-size: 18px;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.18s ease, background-color 0.18s ease;
        }

        .menu-toggle-btn:hover {
            background-color: #ffffff;
            transform: scale(1.07);
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 22px 28px;
            border-bottom: 1px solid rgba(15, 23, 42, 0.04);
            background: transparent;
            flex-shrink: 0;
        }

        .chat-header-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header h2 {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.4px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .header-status {
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--time-text-color);
            font-weight: 600;
            white-space: nowrap;
        }

        .header-status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        #clear-btn {
            border: var(--glass-border);
            background-color: rgba(255, 255, 255, 0.78);
            color: var(--muted-text);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 750;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
        }

        #clear-btn:hover {
            background-color: var(--danger-bg-light);
            color: var(--danger-color);
            border-color: var(--danger-border-light);
            transform: translateY(-1px);
        }

        #chatbox {
            flex: 1;
            padding: 18px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
            background: transparent;
        }

        #chatbox::-webkit-scrollbar-thumb {
            background-color: rgba(15, 23, 42, 0.07);
            border-radius: 999px;
        }

        .empty-placeholder {
            margin: auto;
            width: min(100%, 380px);
            border-radius: 26px;
            border: var(--glass-border);
            background: rgba(255, 255, 255, 0.62);
            box-shadow: var(--shadow-soft);
            padding: 30px 26px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .empty-icon {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.16), rgba(108, 92, 231, 0.04));
            color: var(--primary-color);
            font-size: 24px;
            box-shadow: 0 8px 18px rgba(108, 92, 231, 0.09);
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 850;
            letter-spacing: -0.3px;
            margin-bottom: 7px;
        }

        .empty-desc {
            color: var(--muted-text);
            font-size: 12.5px;
            line-height: 1.55;
            margin-bottom: 18px;
        }

        .type-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .type-btn {
            border: 1px solid rgba(108, 92, 231, 0.13);
            background: rgba(255, 255, 255, 0.68);
            border-radius: 18px;
            padding: 12px 10px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        }

        .type-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(108, 92, 231, 0.32);
            background: #ffffff;
            box-shadow: 0 10px 22px rgba(108, 92, 231, 0.1);
        }

        .type-emoji {
            display: block;
            font-size: 20px;
            margin-bottom: 7px;
        }

        .type-name {
            display: block;
            font-size: 12.5px;
            color: var(--bot-bubble-text);
            font-weight: 800;
            margin-bottom: 3px;
        }

        .type-desc {
            display: block;
            font-size: 10.5px;
            color: var(--muted-text);
            line-height: 1.35;
        }

        .message-container {
            width: 100%;
            display: flex;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .message-container.user-side {
            justify-content: flex-end;
        }

        .message-container.bot-side {
            justify-content: flex-start;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 74%;
        }

        .user-side .message-wrapper {
            align-items: flex-end;
        }

        .bot-side .message-wrapper {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 100%;
            padding: 12px 18px;
            border-radius: 22px;
            font-size: 14.5px;
            line-height: 1.55;
            overflow-wrap: break-word;
            box-shadow: var(--shadow-soft);
        }

        .message-bubble strong {
            font-weight: 850;
        }

        .user-message {
            background-color: var(--user-bubble-bg);
            color: var(--user-bubble-text);
            border-bottom-right-radius: 6px;
        }

        .bot-message {
            background-color: var(--bot-bubble-bg);
            color: var(--bot-bubble-text);
            border: 1px solid rgba(108, 92, 231, 0.13);
            border-bottom-left-radius: 6px;
        }

        .typing-message {
            color: var(--muted-text);
            padding: 12px 16px;
        }

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 14px;
            margin-left: 4px;
            vertical-align: middle;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--muted-text);
            opacity: 0.38;
            animation: bounceDot 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        .message-time {
            color: var(--time-text-color);
            font-size: 10px;
            font-weight: 600;
            margin-top: 6px;
            padding: 0 6px;
            letter-spacing: -0.2px;
        }

        #chat-form {
            display: flex;
            gap: 10px;
            margin: 0 24px 24px;
            padding: 8px 10px;
            border-radius: 999px;
            border: var(--glass-border);
            background-color: rgba(255, 255, 255, 0.88);
            box-shadow: var(--shadow-deep);
            flex-shrink: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }

        #chat-form:focus-within {
            transform: translateY(-1px);
            border-color: rgba(108, 92, 231, 0.36);
            box-shadow: 0 14px 38px rgba(108, 92, 231, 0.14);
            background-color: #ffffff;
        }

        #user-input {
            flex: 1;
            min-width: 0;
            border: 1px solid rgba(15, 23, 42, 0.04);
            border-radius: 999px;
            background-color: var(--bg-input-glass);
            color: var(--bot-bubble-text);
            padding: 10px 18px;
            outline: none;
            font-size: 14.5px;
            transition: background-color 0.18s ease;
        }

        #user-input:focus {
            background-color: transparent;
        }

        #submit-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background-color: var(--primary-color);
            color: #ffffff;
            cursor: pointer;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 18px;
            font-weight: 900;
            padding-bottom: 2px;
            box-shadow: 0 6px 14px rgba(108, 92, 231, 0.3);
            transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
        }

        #submit-btn:hover {
            background-color: var(--primary-hover-color);
            transform: scale(1.06);
            box-shadow: 0 8px 18px rgba(108, 92, 231, 0.36);
        }

        #submit-btn:active {
            transform: scale(0.94);
        }

        .sidebar-overlay,
        .modal-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background-color: var(--modal-overlay-bg);
            backdrop-filter: blur(4px);
            z-index: 99;
        }

        .modal-overlay {
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            width: 86%;
            max-width: 330px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: var(--glass-border);
            border-radius: 26px;
            box-shadow: var(--shadow-deep);
            padding: 26px;
            text-align: center;
            animation: modalScale 0.24s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .modal-text {
            color: var(--bot-bubble-text);
            font-size: 15px;
            line-height: 1.6;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            border: none;
            border-radius: 16px;
            padding: 11px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
            transition: transform 0.18s ease, background-color 0.18s ease;
        }

        .modal-btn:hover {
            transform: translateY(-1px);
        }

        .modal-btn.confirm-btn {
            background-color: var(--danger-color);
            color: #ffffff;
            box-shadow: 0 7px 16px rgba(239, 68, 68, 0.16);
        }

        .modal-btn.confirm-btn:hover {
            background-color: var(--danger-hover-color);
        }

        .modal-btn.cancel-btn {
            background-color: var(--neutral-btn-bg);
            color: var(--neutral-btn-text);
        }

        .modal-btn.cancel-btn:hover {
            background-color: var(--neutral-btn-hover);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceDot {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.38;
            }
            40% {
                transform: scale(1.1);
                opacity: 0.9;
            }
        }

        @keyframes modalScale {
            from {
                opacity: 0;
                transform: scale(0.86);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 12px;
                gap: 12px;
                height: 100vh;
            }

            .sidebar {
                position: absolute;
                top: 12px;
                left: 12px;
                width: min(270px, calc(100% - 38px));
                height: calc(100% - 24px);
                transform: translateX(-112%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle-btn {
                display: flex;
            }

            .chat-header {
                padding: 20px 16px 18px 72px;
            }

            .chat-header h2 {
                font-size: 16px;
            }

            #chatbox {
                padding: 16px;
                gap: 16px;
            }

            .message-wrapper {
                max-width: 82%;
            }

            .type-grid {
                grid-template-columns: 1fr;
            }

            #chat-form {
                margin: 0 14px 14px;
                padding: 6px 8px;
                gap: 8px;
            }

            #user-input {
                padding: 10px 14px;
                font-size: 14px;
            }

            #submit-btn {
                width: 36px;
                height: 36px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decor-1"></div>
    <div class="bg-decor-2"></div>
    <div class="bg-decor-3"></div>

    <div class="app-container">
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon">✨</div>
                    <div class="logo-info">
                        <span class="logo-name">미니챗봇</span>
                        <span class="logo-desc">Floating AI Companion</span>
                    </div>
                </div>
                <div class="sidebar-title">이전 채팅</div>
                <button id="new-chat-btn" class="new-chat-btn" type="button">+ 새 채팅</button>
            </div>
            <div id="chat-list" class="chat-list"></div>
        </aside>

        <main class="chat-container">
            <button id="menu-toggle-btn" class="menu-toggle-btn" type="button" aria-label="이전 채팅 열기">☰</button>

            <header class="chat-header">
                <div class="chat-header-info">
                    <h2 id="header-title">미니챗봇</h2>
                    <div id="header-status" class="header-status">로컬에 저장됨 · 현재 대화</div>
                </div>
                <button id="clear-btn" type="button">대화 초기화</button>
            </header>

            <section id="chatbox" aria-live="polite"></section>

            <form id="chat-form">
                <input type="text" id="user-input" placeholder="미니챗봇에게 메시지 보내기..." autocomplete="off" required>
                <button type="submit" id="submit-btn" aria-label="전송">↑</button>
            </form>

            <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true">
                <div class="modal-content">
                    <div id="modal-text" class="modal-text">정말 현재 대화를 초기화할까요?</div>
                    <div class="modal-buttons">
                        <button type="button" id="modal-cancel-btn" class="modal-btn cancel-btn">취소</button>
                        <button type="button" id="modal-confirm-btn" class="modal-btn confirm-btn">확인</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const BOT_NAME = '미니챗봇';
            const SESSIONS_STORAGE_KEY = 'minichat_sessions_v1';
            const CURRENT_SESSION_KEY = 'minichat_current_session_id';
            const OLD_STORAGE_KEY = 'minichat_messages_v1';

            const chatForm = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');
            const chatbox = document.getElementById('chatbox');
            const clearBtn = document.getElementById('clear-btn');
            const headerTitle = document.getElementById('header-title');
            const headerStatus = document.getElementById('header-status');
            const sidebar = document.getElementById('sidebar');
            const chatListContainer = document.getElementById('chat-list');
            const newChatBtn = document.getElementById('new-chat-btn');
            const menuToggleBtn = document.getElementById('menu-toggle-btn');
            const sidebarOverlay = document.getElementById('sidebar-overlay');
            const confirmModal = document.getElementById('confirm-modal');
            const modalText = document.getElementById('modal-text');
            const modalCancelBtn = document.getElementById('modal-cancel-btn');
            const modalConfirmBtn = document.getElementById('modal-confirm-btn');

            const CHAT_TYPES = {
                soft: {
                    emoji: '☁️',
                    name: '말랑 대화',
                    desc: '부드럽게 들어주는 방'
                },
                coding: {
                    emoji: '💻',
                    name: '코딩 도움',
                    desc: '버그와 구조를 같이 보는 방'
                },
                study: {
                    emoji: '📚',
                    name: '공부 모드',
                    desc: '차근차근 설명하는 방'
                },
                idea: {
                    emoji: '💡',
                    name: '아이디어',
                    desc: '새로운 생각을 뽑는 방'
                },
                concise: {
                    emoji: '⚡',
                    name: '짧은 답변',
                    desc: '핵심만 빠르게 보는 방'
                }
            };

            const BOT_RESPONSES = {
                greeting: [
                    '안녕하세요! 오늘 하루는 어떠신가요?',
                    '반가워요! 어떤 이야기부터 시작해볼까요?',
                    '안녕! 지금부터 대화 엔진 가동합니다.'
                ],
                status: [
                    '대기 중이었어요. 메시지 오자마자 회로가 반짝했네요!',
                    '지금은 당신과 대화할 준비를 하고 있었어요.',
                    '조용히 떠 있다가 호출받았습니다. 둥둥.'
                ],
                help: [
                    '안녕, 뭐해, 이름, 날씨 같은 말을 해보세요. 방 타입에 따라 말투도 조금 달라져요.',
                    '왼쪽에서 새 채팅을 만들고, 빈 방에서 대화 타입을 고를 수 있어요.',
                    '이전 채팅은 브라우저에 저장되고, 필요하면 현재 대화만 초기화할 수 있어요.'
                ],
                name: [
                    `제 이름은 ${BOT_NAME}입니다. 작지만 꽤 야무진 대화 도구예요.`,
                    `저는 ${BOT_NAME}. 브라우저 안에 둥둥 떠 있는 작은 챗봇입니다.`,
                    `${BOT_NAME}이라고 불러주세요. 아직은 규칙 기반이지만 성장 중이에요.`
                ],
                weather: [
                    '실시간 날씨는 아직 못 보지만, 창밖을 보면 가장 정확한 API가 열립니다.',
                    '날씨 기능은 다음 업그레이드 후보예요. 지금은 기분만 화창하게 가보죠.',
                    '오늘이 어떤 날씨든, 이 채팅방만큼은 보송하게 유지해볼게요.'
                ],
                fallback: [
                    '아직 그 말은 배우지 못했어요. 그래도 방향을 알려주면 열심히 따라가볼게요.',
                    '음, 제 규칙 사전에는 없는 문장이네요. “도움”을 입력하면 가능한 말을 볼 수 있어요.',
                    '지금은 미니 버전이라 모르는 말이 있어요. 그래도 조금씩 똑똑해지는 중입니다.'
                ],
                byType: {
                    soft: [
                        '그 말, 천천히 풀어봐도 괜찮아요. 지금은 말랑하게 들어볼게요.',
                        '괜찮아요. 정답부터 찾기보다 마음의 실타래부터 살살 풀어보죠.'
                    ],
                    coding: [
                        '코딩방 모드입니다. 에러 메시지나 코드를 주면 원인부터 같이 쪼개볼게요.',
                        '좋아요. 문제를 재현 조건, 원인 후보, 수정 방향으로 나눠봅시다.'
                    ],
                    study: [
                        '공부 모드로 보면, 먼저 핵심 개념을 잡고 예시로 확인하는 게 좋아요.',
                        '이건 단계별로 정리하면 쉬워져요. 먼저 아는 것과 모르는 것을 나눠볼까요?'
                    ],
                    idea: [
                        '아이디어방답게 후보를 여러 갈래로 뽑아볼게요. 작은 씨앗부터 심어봅시다.',
                        '좋아요. 이건 콘셉트, 기능, 화면 흐름으로 나눠서 생각하면 재밌어져요.'
                    ],
                    concise: [
                        '핵심만 말하면, 지금 질문은 더 구체적인 조건이 필요해요.',
                        '요약: 방향은 좋고, 다음 한 가지를 정하면 됩니다.'
                    ]
                }
            };

            let chatSessions = [];
            let currentSessionId = null;
            let pendingAction = null;

            const getFormattedTime = () => {
                const now = new Date();
                const hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const ampm = hours >= 12 ? '오후' : '오전';
                const displayHours = hours % 12 || 12;
                return `${ampm} ${displayHours}:${minutes}`;
            };

            const createNewSession = (title = '새 대화') => {
                const id = `session_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
                return {
                    id,
                    title,
                    type: null,
                    createdAt: Date.now(),
                    updatedAt: Date.now(),
                    messages: []
                };
            };

            const getCurrentSession = () => chatSessions.find(session => session.id === currentSessionId) || chatSessions[0];

            const getTypeMeta = (typeKey) => typeKey && CHAT_TYPES[typeKey] ? CHAT_TYPES[typeKey] : null;

            const getSessionDisplayTitle = (session) => {
                if (!session) return '새 대화';
                const hasUserMessage = session.messages.some(message => message.sender === 'user');
                const typeMeta = getTypeMeta(session.type);
                if (!hasUserMessage && typeMeta) return `${typeMeta.emoji} ${typeMeta.name}`;
                return session.title || '새 대화';
            };

            const getSessionPreview = (session) => {
                const validMessages = session.messages.filter(message => !message.isTyping);
                if (validMessages.length === 0) {
                    const typeMeta = getTypeMeta(session.type);
                    return typeMeta ? `${typeMeta.name} 모드가 선택됨` : '타입을 선택하고 시작하세요';
                }
                const lastText = validMessages[validMessages.length - 1].text;
                return lastText.length > 22 ? `${lastText.slice(0, 22)}...` : lastText;
            };

            const loadAppSessions = () => {
                const savedSessions = localStorage.getItem(SESSIONS_STORAGE_KEY);
                const savedCurrentId = localStorage.getItem(CURRENT_SESSION_KEY);

                if (savedSessions) {
                    try {
                        const parsed = JSON.parse(savedSessions);
                        chatSessions = Array.isArray(parsed) ? parsed : [];
                    } catch (error) {
                        chatSessions = [];
                    }
                }

                if (chatSessions.length === 0) {
                    const oldMessages = localStorage.getItem(OLD_STORAGE_KEY);
                    if (oldMessages) {
                        try {
                            const parsedMessages = JSON.parse(oldMessages).filter(message => !message.isTyping);
                            if (parsedMessages.length > 0) {
                                chatSessions.push({
                                    id: `session_migrated_${Date.now()}`,
                                    title: '가져온 대화',
                                    type: null,
                                    createdAt: Date.now(),
                                    updatedAt: Date.now(),
                                    messages: parsedMessages
                                });
                                localStorage.removeItem(OLD_STORAGE_KEY);
                            }
                        } catch (error) {
                            localStorage.removeItem(OLD_STORAGE_KEY);
                        }
                    }
                }

                chatSessions = chatSessions.map(session => ({
                    ...createNewSession(),
                    ...session,
                    messages: Array.isArray(session.messages) ? session.messages.filter(message => !message.isTyping) : []
                }));

                if (chatSessions.length === 0) {
                    chatSessions.push(createNewSession());
                }

                currentSessionId = savedCurrentId && chatSessions.some(session => session.id === savedCurrentId)
                    ? savedCurrentId
                    : chatSessions[0].id;
            };

            const saveAppSessions = () => {
                const persistentSessions = chatSessions.map(session => ({
                    ...session,
                    messages: session.messages.filter(message => !message.isTyping)
                }));
                localStorage.setItem(SESSIONS_STORAGE_KEY, JSON.stringify(persistentSessions));
                localStorage.setItem(CURRENT_SESSION_KEY, currentSessionId);
            };

            const renderHeader = () => {
                const currentSession = getCurrentSession();
                const typeMeta = getTypeMeta(currentSession.type);
                headerTitle.textContent = BOT_NAME;
                headerStatus.textContent = typeMeta
                    ? `로컬에 저장됨 · ${typeMeta.emoji} ${typeMeta.name}`
                    : '로컬에 저장됨 · 타입 선택 대기';
            };

            const renderTypePicker = () => {
                const placeholder = document.createElement('div');
                placeholder.className = 'empty-placeholder';

                const icon = document.createElement('div');
                icon.className = 'empty-icon';
                icon.textContent = '✨';

                const title = document.createElement('div');
                title.className = 'empty-title';
                title.textContent = '어떤 대화를 시작할까요?';

                const desc = document.createElement('div');
                desc.className = 'empty-desc';
                desc.textContent = '새 방의 성격을 고르면 그 분위기에 맞춰 답해요.';

                const grid = document.createElement('div');
                grid.className = 'type-grid';

                Object.entries(CHAT_TYPES).forEach(([typeKey, type]) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'type-btn';
                    button.addEventListener('click', () => selectChatType(typeKey));

                    const emoji = document.createElement('span');
                    emoji.className = 'type-emoji';
                    emoji.textContent = type.emoji;

                    const name = document.createElement('span');
                    name.className = 'type-name';
                    name.textContent = type.name;

                    const typeDesc = document.createElement('span');
                    typeDesc.className = 'type-desc';
                    typeDesc.textContent = type.desc;

                    button.append(emoji, name, typeDesc);
                    grid.appendChild(button);
                });

                placeholder.append(icon, title, desc, grid);
                chatbox.appendChild(placeholder);
            };

            const renderEmptyTypedRoom = (typeMeta) => {
                const placeholder = document.createElement('div');
                placeholder.className = 'empty-placeholder';

                const icon = document.createElement('div');
                icon.className = 'empty-icon';
                icon.textContent = typeMeta.emoji;

                const title = document.createElement('div');
                title.className = 'empty-title';
                title.textContent = `${typeMeta.name} 모드`;

                const desc = document.createElement('div');
                desc.className = 'empty-desc';
                desc.textContent = '아래 입력창에 메시지를 입력해서 대화를 시작해보세요.';

                placeholder.append(icon, title, desc);
                chatbox.appendChild(placeholder);
            };

            const renderMessages = () => {
                chatbox.innerHTML = '';
                const currentSession = getCurrentSession();
                renderHeader();

                if (currentSession.messages.length === 0) {
                    const typeMeta = getTypeMeta(currentSession.type);
                    if (typeMeta) {
                        renderEmptyTypedRoom(typeMeta);
                    } else {
                        renderTypePicker();
                    }
                    return;
                }

                currentSession.messages.forEach(message => {
                    const container = document.createElement('div');
                    container.className = `message-container ${message.sender === 'user' ? 'user-side' : 'bot-side'}`;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'message-wrapper';

                    const bubble = document.createElement('div');
                    bubble.className = `message-bubble ${message.sender === 'user' ? 'user-message' : 'bot-message'}`;

                    const label = document.createElement('strong');
                    label.textContent = message.sender === 'user' ? '사용자: ' : `${BOT_NAME}: `;
                    bubble.appendChild(label);

                    if (message.isTyping) {
                        bubble.classList.add('typing-message');
                        const dots = document.createElement('span');
                        dots.className = 'typing-dots';
                        for (let i = 0; i < 3; i += 1) {
                            dots.appendChild(document.createElement('span'));
                        }
                        bubble.appendChild(dots);
                    } else {
                        bubble.appendChild(document.createTextNode(message.text));
                    }

                    wrapper.appendChild(bubble);

                    if (!message.isTyping && message.time) {
                        const time = document.createElement('div');
                        time.className = 'message-time';
                        time.textContent = message.time;
                        wrapper.appendChild(time);
                    }

                    container.appendChild(wrapper);
                    chatbox.appendChild(container);
                });

                chatbox.scrollTop = chatbox.scrollHeight;
            };

            const renderChatList = () => {
                chatListContainer.innerHTML = '';

                chatSessions.forEach(session => {
                    const item = document.createElement('div');
                    item.className = `chat-item ${session.id === currentSessionId ? 'active' : ''}`;
                    item.addEventListener('click', () => {
                        currentSessionId = session.id;
                        saveAppSessions();
                        renderChatList();
                        renderMessages();
                        closeSidebarOnMobile();
                    });

                    const main = document.createElement('div');
                    main.className = 'chat-item-main';

                    const title = document.createElement('div');
                    title.className = 'chat-item-title';
                    title.textContent = getSessionDisplayTitle(session);

                    const preview = document.createElement('div');
                    preview.className = 'chat-item-preview';
                    preview.textContent = getSessionPreview(session);

                    const deleteButton = document.createElement('button');
                    deleteButton.type = 'button';
                    deleteButton.className = 'chat-delete-btn';
                    deleteButton.textContent = '×';
                    deleteButton.setAttribute('aria-label', '채팅방 삭제');
                    deleteButton.addEventListener('click', event => {
                        event.stopPropagation();
                        askDeleteSession(session.id);
                    });

                    main.append(title, preview);
                    item.append(main, deleteButton);
                    chatListContainer.appendChild(item);
                });
            };

            const addMessage = (text, sender, isTyping = false) => {
                const currentSession = getCurrentSession();
                const newMessage = {
                    id: Date.now() + Math.random(),
                    text,
                    sender,
                    isTyping,
                    time: getFormattedTime()
                };

                currentSession.messages.push(newMessage);
                currentSession.updatedAt = Date.now();

                if (sender === 'user') {
                    const userMessagesCount = currentSession.messages.filter(message => message.sender === 'user').length;
                    if (userMessagesCount === 1) {
                        currentSession.title = text.length > 15 ? `${text.slice(0, 15)}...` : text;
                    }
                }

                renderMessages();
                renderChatList();
                saveAppSessions();
                return newMessage.id;
            };

            const removeMessage = (id) => {
                const currentSession = getCurrentSession();
                currentSession.messages = currentSession.messages.filter(message => message.id !== id);
                renderMessages();
                renderChatList();
                saveAppSessions();
            };

            const selectChatType = (typeKey) => {
                const currentSession = getCurrentSession();
                currentSession.type = typeKey;
                currentSession.updatedAt = Date.now();
                renderMessages();
                renderChatList();
                saveAppSessions();
                userInput.focus();
            };

            const handleSendMessage = () => {
                const text = userInput.value.trim();
                if (!text) return;

                const currentSession = getCurrentSession();
                if (!currentSession.type) {
                    currentSession.type = 'soft';
                }

                addMessage(text, 'user');
                userInput.value = '';

                const typingId = addMessage('입력 중...', 'bot', true);

                setTimeout(() => {
                    removeMessage(typingId);
                    addMessage(getBotResponse(text), 'bot');
                }, 720);
            };

            const startNewChat = () => {
                const newSession = createNewSession();
                chatSessions.unshift(newSession);
                currentSessionId = newSession.id;
                saveAppSessions();
                renderChatList();
                renderMessages();
                closeSidebarOnMobile();
                userInput.focus();
            };

            const clearCurrentChat = () => {
                const currentSession = getCurrentSession();
                currentSession.title = '새 대화';
                currentSession.messages = [];
                currentSession.updatedAt = Date.now();
                saveAppSessions();
                renderChatList();
                renderMessages();
                userInput.focus();
            };

            const deleteSession = (sessionId) => {
                chatSessions = chatSessions.filter(session => session.id !== sessionId);

                if (chatSessions.length === 0) {
                    const newSession = createNewSession();
                    chatSessions.push(newSession);
                    currentSessionId = newSession.id;
                } else if (currentSessionId === sessionId) {
                    currentSessionId = chatSessions[0].id;
                }

                saveAppSessions();
                renderChatList();
                renderMessages();
            };

            const showModal = (text, confirmLabel, action) => {
                modalText.innerHTML = '';
                modalText.appendChild(document.createTextNode(text));
                modalConfirmBtn.textContent = confirmLabel;
                pendingAction = action;
                confirmModal.classList.add('active');
            };

            const hideModal = () => {
                confirmModal.classList.remove('active');
                pendingAction = null;
            };

            const askClearCurrentChat = () => {
                showModal('정말 현재 대화를 초기화할까요? 해당 채팅방의 내용만 비워집니다.', '초기화', clearCurrentChat);
            };

            const askDeleteSession = (sessionId) => {
                showModal('이 채팅방을 삭제할까요? 대화 내용은 복구할 수 없어요.', '삭제', () => deleteSession(sessionId));
            };

            const openSidebar = () => {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('active');
            };

            const closeSidebarOnMobile = () => {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            };

            const getRandomResponse = (list) => list[Math.floor(Math.random() * list.length)];

            const getBotResponse = (input) => {
                const cleanInput = input.replace(/\s+/g, '');
                const currentType = getCurrentSession().type || 'soft';

                if (cleanInput.includes('안녕')) return getRandomResponse(BOT_RESPONSES.greeting);
                if (cleanInput.includes('뭐해') || cleanInput.includes('무슨일')) return getRandomResponse(BOT_RESPONSES.status);
                if (cleanInput.includes('도움')) return getRandomResponse(BOT_RESPONSES.help);
                if (cleanInput.includes('이름')) return getRandomResponse(BOT_RESPONSES.name);
                if (cleanInput.includes('날씨')) return getRandomResponse(BOT_RESPONSES.weather);
                if (BOT_RESPONSES.byType[currentType]) return getRandomResponse(BOT_RESPONSES.byType[currentType]);
                return getRandomResponse(BOT_RESPONSES.fallback);
            };

            chatForm.addEventListener('submit', event => {
                event.preventDefault();
                handleSendMessage();
            });

            userInput.addEventListener('keydown', event => {
                if (event.key === 'Enter' && !event.isComposing) {
                    event.preventDefault();
                    handleSendMessage();
                }
            });

            newChatBtn.addEventListener('click', startNewChat);
            clearBtn.addEventListener('click', askClearCurrentChat);
            menuToggleBtn.addEventListener('click', openSidebar);
            sidebarOverlay.addEventListener('click', closeSidebarOnMobile);

            modalCancelBtn.addEventListener('click', hideModal);
            modalConfirmBtn.addEventListener('click', () => {
                if (typeof pendingAction === 'function') {
                    pendingAction();
                }
                hideModal();
            });

            confirmModal.addEventListener('click', event => {
                if (event.target === confirmModal) hideModal();
            });

            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    hideModal();
                    closeSidebarOnMobile();
                }
            });

            loadAppSessions();
            saveAppSessions();
            renderChatList();
            renderMessages();
        });
    </script>
</body>
</html>
